<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="lateral" id="lateral">
    <div class="marca">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
      </div>
      Assistente
    </div>

    <button type="button" class="btn-nova" id="nova">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Nova conversa
    </button>

    <nav class="secao" aria-label="Agentes">
      <span class="secao-titulo">Agentes</span>
      <button type="button" class="agente" data-exemplo="Ex.: Qual o clima agora em Curitiba?">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
        Localidades
      </button>
      <button type="button" class="agente" data-exemplo="Ex.: Artigos sobre energia solar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H10a2 2 0 0 1 2 2v14a1.5 1.5 0 0 0-1.5-1.5h-5A1.5 1.5 0 0 1 4 17z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H14a2 2 0 0 0-2 2v14a1.5 1.5 0 0 1 1.5-1.5h5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
        Artigos científicos
      </button>
    </nav>

    <section class="secao" aria-label="Histórico">
      <span class="secao-titulo">Histórico</span>
      <span class="historico-vazio">Nenhuma conversa ainda.</span>
    </section>

    <div class="lateral-rodape">
      <button type="button" class="btn-tema" id="tema">
        <svg id="icone-sol" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="icone-lua" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <span id="tema-texto">Modo claro</span>
      </button>
    </div>
  </aside>

  <main class="principal" id="principal">
    <header class="topo">
      <button type="button" class="btn-menu" id="menu" aria-label="Abrir menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="status">Online</span>
    </header>

    <div id="mensagens">
      <div class="conteudo" id="conteudo"></div>
    </div>

    <div class="palco">
      <div class="palco-interno">
        <div class="hero">
          <h1>Para onde, <span>ou sobre o quê?</span></h1>
          <p>Pergunte sobre um lugar ou peça artigos científicos.</p>
        </div>

        <form class="composer" id="form">
          <label for="pergunta" class="oculto-visual">Sua pergunta</label>
          <textarea id="pergunta" rows="2" placeholder="Pergunte sobre uma cidade ou peça artigos científicos…"></textarea>
          <div class="composer-acoes">
            <button type="submit" class="btn-enviar" id="botao" aria-label="Enviar pergunta">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </form>

        <div class="sugestoes">
          <button type="button" class="sug" data-pergunta="Qual o clima agora em Florianópolis?">Clima agora em Florianópolis</button>
          <button type="button" class="sug" data-pergunta="Previsão do tempo para os próximos 5 dias em Recife">Previsão de 5 dias em Recife</button>
          <button type="button" class="sug" data-pergunta="Me dê um resumo sobre Ouro Preto">Resumo sobre Ouro Preto</button>
          <button type="button" class="sug" data-pergunta="Artigos científicos sobre inteligência artificial na saúde">Artigos sobre IA na saúde</button>
        </div>
      </div>
    </div>

    <footer class="aviso">As respostas são geradas por IA e podem conter erros.</footer>
  </main>

  <script>
    const principal = document.getElementById("principal");
    const form = document.getElementById("form");
    const pergunta = document.getElementById("pergunta");
    const botao = document.getElementById("botao");
    const mensagens = document.getElementById("mensagens");
    const conteudo = document.getElementById("conteudo");
    const lateral = document.getElementById("lateral");
    const PLACEHOLDER_PADRAO = pergunta.placeholder;

    const ICONE_IA = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>';

    // ---------- Formatação ----------
    function formatar(texto) {
      const seguro = texto
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      return seguro
        .replace(/^#{1,6}\s*(.+)$/gm, "<strong>$1</strong>")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(
          /(https?:\/\/[^\s<]+)/g,
          '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
        );
    }

    function rolar() {
      mensagens.scrollTop = mensagens.scrollHeight;
    }

    const ICONE_COPIAR = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    const ICONE_COPIADO = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
    const ICONE_EXTERNO = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';

    // Nome exibido de cada destino do orquestrador.
    const NOMES_AGENTES = {
      localidade: "Localidades",
      artigo: "Artigos científicos",
      fora_escopo: "Fora do escopo",
    };

    function escapar(texto) {
      return String(texto ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Só aceita links http(s), para um link vindo da API não executar código.
    function linkSeguro(url) {
      return /^https?:\/\//i.test(url || "") ? url : "#";
    }

    // ---------- Mensagens ----------
    function adicionarUsuario(texto) {
      const linha = document.createElement("div");
      linha.className = "linha usuario";
      linha.innerHTML = '<div class="bloco"><div class="msg"></div></div>';
      linha.querySelector(".msg").textContent = texto;
      conteudo.appendChild(linha);
      rolar();
    }

    // Cria a resposta da IA: selo da rota (escondido até chegar) + corpo com "digitando".
    function criarRespostaIa() {
      const linha = document.createElement("div");
      linha.className = "linha ia";
      linha.innerHTML = `
        <div class="avatar">${ICONE_IA}</div>
        <div class="bloco">
          <div class="rota" hidden></div>
          <div class="msg digitando"><span></span><span></span><span></span></div>
        </div>`;
      conteudo.appendChild(linha);
      rolar();
      return {
        bloco: linha.querySelector(".bloco"),
        rota: linha.querySelector(".rota"),
        corpo: linha.querySelector(".msg"),
      };
    }

    function mostrarRota(resposta, agente) {
      resposta.rota.innerHTML = `
        <span>Orquestrador</span>
        <span class="rota-seta">→</span>
        <span class="rota-agente">${escapar(NOMES_AGENTES[agente] || agente)}</span>
        <span class="rota-extra"></span>`;
      resposta.rota.hidden = false;
    }

    function mostrarTexto(resposta, texto) {
      resposta.corpo.className = "msg";
      resposta.corpo.innerHTML = formatar(texto);
    }

    function mostrarErro(resposta, mensagem) {
      resposta.corpo.className = "msg erro";
      resposta.corpo.textContent = mensagem;
    }

    function criarCard(artigo, numero) {
      const autores =
        artigo.autores.slice(0, 3).join(", ") + (artigo.autores.length > 3 ? " et al." : "");
      const meta = [autores || "Autores não informados", artigo.fonte, artigo.ano]
        .filter(Boolean)
        .join(" · ");
      const link = linkSeguro(artigo.link);

      const card = document.createElement("li");
      card.className = "card";
      card.innerHTML = `
        <button type="button" class="card-topo" aria-expanded="false">
          <span class="card-num">${numero}</span>
          <span class="card-info">
            <span class="card-titulo">${escapar(artigo.titulo)}</span>
            <span class="card-meta">${escapar(meta)}</span>
            <span class="card-resumo">${escapar(artigo.resumo_curto)}</span>
          </span>
        </button>
        <a class="card-link" href="${escapar(link)}" target="_blank" rel="noopener noreferrer"
           aria-label="Abrir artigo completo" title="Abrir artigo completo">${ICONE_EXTERNO}</a>
        <div class="card-detalhe" hidden>
          <p class="card-detalhe-titulo">Resumo original</p>
          <p>${escapar(artigo.resumo || "Resumo não disponível.")}</p>
          <a class="card-ler" href="${escapar(link)}" target="_blank" rel="noopener noreferrer">
            Ler artigo completo ${ICONE_EXTERNO}
          </a>
        </div>`;

      // Clicar no card abre/fecha o resumo completo.
      const topo = card.querySelector(".card-topo");
      const detalhe = card.querySelector(".card-detalhe");
      topo.addEventListener("click", () => {
        const abrir = detalhe.hidden;
        detalhe.hidden = !abrir;
        card.classList.toggle("aberto", abrir);
        topo.setAttribute("aria-expanded", String(abrir));
      });
      return card;
    }

    function mostrarArtigos(resposta, evento) {
      const total = evento.itens.length;
      resposta.bloco.classList.add("largo");
      resposta.rota.querySelector(".rota-extra").textContent =
        `· ${total} ${total === 1 ? "resultado" : "resultados"}`;

      resposta.corpo.className = "artigos";
      resposta.corpo.innerHTML = "";

      const intro = document.createElement("p");
      intro.className = "artigos-intro";
      // O modelo às vezes termina a introdução com ":"; troca por ponto antes da dica.
      const introducao = evento.introducao.trim().replace(/[:;,]$/, ".");
      intro.textContent = introducao + (total ? " Abra um para ver o resumo completo." : "");
      resposta.corpo.appendChild(intro);

      if (total) {
        const lista = document.createElement("ol");
        lista.className = "cards";
        evento.itens.forEach((artigo, i) => lista.appendChild(criarCard(artigo, i + 1)));
        resposta.corpo.appendChild(lista);
      }
    }

    // Versão em texto dos artigos, para o botão de copiar.
    function artigosComoTexto(evento) {
      const itens = evento.itens.map((a, i) =>
        `${i + 1}. ${a.titulo}\n${a.autores.join(", ")} · ${a.fonte} · ${a.ano ?? ""}\n${a.resumo_curto}\n${a.link}`
      );
      return [evento.introducao, ...itens].join("\n\n");
    }

    // Botão de copiar que aparece ao passar o mouse sobre a resposta.
    function adicionarAcoes(resposta, texto) {
      const acoes = document.createElement("div");
      acoes.className = "acoes";

      const copiar = document.createElement("button");
      copiar.type = "button";
      copiar.className = "acao";
      copiar.title = "Copiar";
      copiar.setAttribute("aria-label", "Copiar resposta");
      copiar.innerHTML = ICONE_COPIAR;
      copiar.addEventListener("click", async () => {
        await navigator.clipboard.writeText(texto);
        copiar.innerHTML = ICONE_COPIADO;
        copiar.title = "Copiado";
        setTimeout(() => {
          copiar.innerHTML = ICONE_COPIAR;
          copiar.title = "Copiar";
        }, 1500);
      });

      acoes.appendChild(copiar);
      resposta.bloco.appendChild(acoes);
    }

    // ---------- Campo de texto ----------
    function ajustarAltura() {
      pergunta.style.height = "auto";
      pergunta.style.height = pergunta.scrollHeight + "px";
    }

    pergunta.addEventListener("input", ajustarAltura);

    // Enter envia; Shift+Enter quebra linha.
    pergunta.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    // ---------- Envio ----------
    async function enviar(texto) {
      texto = texto.trim();
      if (!texto || botao.disabled) return;

      principal.classList.add("conversando");
      adicionarUsuario(texto);
      pergunta.value = "";
      ajustarAltura();
      botao.disabled = true;
      const resposta = criarRespostaIa();

      let textoAcumulado = "";
      let textoParaCopiar = "";

      // Cada linha do stream é um evento JSON (ver transmitir no orquestrador).
      function processar(evento) {
        if (evento.tipo === "rota") {
          mostrarRota(resposta, evento.agente);
        } else if (evento.tipo === "texto") {
          textoAcumulado += evento.conteudo;
          mostrarTexto(resposta, textoAcumulado);
          textoParaCopiar = textoAcumulado;
        } else if (evento.tipo === "artigos") {
          mostrarArtigos(resposta, evento);
          textoParaCopiar = artigosComoTexto(evento);
        } else if (evento.tipo === "erro") {
          mostrarErro(resposta, evento.mensagem);
        }
        rolar();
      }

      try {
        const resp = await fetch("/api/informacao", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pergunta: texto }),
        });
        if (!resp.ok) {
          const dados = await resp.json();
          throw new Error(dados.erro);
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let pendente = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          pendente += decoder.decode(value, { stream: true });

          // Um pedaço da rede pode trazer meia linha: processa só as completas.
          let quebra;
          while ((quebra = pendente.indexOf("\n")) >= 0) {
            const linha = pendente.slice(0, quebra).trim();
            pendente = pendente.slice(quebra + 1);
            if (linha) processar(JSON.parse(linha));
          }
        }
        if (pendente.trim()) processar(JSON.parse(pendente));

        if (textoParaCopiar) {
          adicionarAcoes(resposta, textoParaCopiar);
        } else if (resposta.corpo.classList.contains("digitando")) {
          mostrarErro(resposta, "Sem resposta do agente.");
        }
      } catch (err) {
        mostrarErro(resposta, err.message);
      } finally {
        botao.disabled = false;
        pergunta.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      enviar(pergunta.value);
    });

    document.querySelectorAll(".sug").forEach((b) => {
      b.addEventListener("click", () => enviar(b.dataset.pergunta));
    });

    // ---------- Barra lateral ----------
    document.getElementById("nova").addEventListener("click", () => {
      conteudo.innerHTML = "";
      principal.classList.remove("conversando");
      pergunta.placeholder = PLACEHOLDER_PADRAO;
      lateral.classList.remove("aberta");
      pergunta.focus();
    });

    // Clicar num agente mostra um exemplo de pergunta no campo.
    document.querySelectorAll(".agente").forEach((b) => {
      b.addEventListener("click", () => {
        pergunta.placeholder = b.dataset.exemplo;
        lateral.classList.remove("aberta");
        pergunta.focus();
      });
    });

    document.getElementById("menu").addEventListener("click", () => {
      lateral.classList.toggle("aberta");
    });

    // ---------- Tema claro/escuro ----------
    const temaTexto = document.getElementById("tema-texto");
    const iconeSol = document.getElementById("icone-sol");
    const iconeLua = document.getElementById("icone-lua");

    function aplicarTema(tema) {
      document.documentElement.dataset.tema = tema;
      const escuro = tema === "escuro";
      temaTexto.textContent = escuro ? "Modo claro" : "Modo escuro";
      iconeSol.style.display = escuro ? "" : "none";
      iconeLua.style.display = escuro ? "none" : "";
      try { localStorage.setItem("tema", tema); } catch {}
    }

    document.getElementById("tema").addEventListener("click", () => {
      aplicarTema(document.documentElement.dataset.tema === "escuro" ? "claro" : "escuro");
    });

    let temaSalvo = null;
    try { temaSalvo = localStorage.getItem("tema"); } catch {}
    aplicarTema(temaSalvo || "escuro");

    pergunta.focus();
  </script>
</body>
</html>
